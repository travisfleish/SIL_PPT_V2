[project]
name = "sports-innovation-lab"
version = "1.0.0"
description = "Sports Innovation Lab Analytics and Presentation Generation System"
requires-python = ">=3.8"
dependencies = [
    "python-dotenv>=0.19.0",
    "pyyaml>=6.0",
    "pandas>=1.5.0",
    "numpy>=1.21.0",
    "openai>=1.0.0",
    "Pillow>=9.0.0",
    "matplotlib>=3.5.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["utils", "data_processors", "config"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]
