# config/team_config.yaml

# Global view patterns - these are consistent across all teams

view_patterns:
  # Existing patterns
  community_all_time: "{prefix}_COMMUNITY_INDEXING_ALL_TIME"
  community_snapshot: "{prefix}_COMMUNITY_INDEXING_SNAPSHOT"
  community_yoy: "{prefix}_COMMUNITY_INDEXING_YOY"
  community_last_full_year: "{prefix}_COMMUNITY_INDEXING_LAST_FULL_YEAR"  # NEW

  category_all_time: "{prefix}_CATEGORY_INDEXING_ALL_TIME"
  category_snapshot: "{prefix}_CATEGORY_INDEXING_SNAPSHOT"
  category_yoy: "{prefix}_CATEGORY_INDEXING_YOY"
  category_last_full_year: "{prefix}_CATEGORY_INDEXING_LAST_FULL_YEAR"  # NEW

  subcategory_all_time: "{prefix}_SUBCATEGORY_INDEXING_ALL_TIME"
  subcategory_snapshot: "{prefix}_SUBCATEGORY_INDEXING_SNAPSHOT"
  subcategory_yoy: "{prefix}_SUBCATEGORY_INDEXING_YOY"
  subcategory_last_full_year: "{prefix}_SUBCATEGORY_INDEXING_LAST_FULL_YEAR"  # NEW

  merchant_all_time: "{prefix}_MERCHANT_INDEXING_ALL_TIME"
  merchant_snapshot: "{prefix}_MERCHANT_INDEXING_SNAPSHOT"
  merchant_yoy: "{prefix}_MERCHANT_INDEXING_YOY"
  merchant_last_full_year: "{prefix}_MERCHANT_INDEXING_LAST_FULL_YEAR"  # NEW

  community_merchant_all_time: "{prefix}_COMMUNITY_MERCHANT_INDEXING_ALL_TIME"
  community_merchant_snapshot: "{prefix}_COMMUNITY_MERCHANT_INDEXING_SNAPSHOT"
  community_merchant_yoy: "{prefix}_COMMUNITY_MERCHANT_INDEXING_YOY"
  community_merchant_last_full_year: "{prefix}_COMMUNITY_MERCHANT_INDEXING_LAST_FULL_YEAR"  # NEW

  demographics: "{prefix}_DEMOGRAPHICS_DIST"

# Team-specific configurations
teams:
  utah_jazz:
    team_name: "Utah Jazz"
    team_name_short: "Jazz"
    league: "NBA"
    view_prefix: "V_UTAH_JAZZ_SIL"  # Has SIL in the prefix
    colors:
      primary: "#002B5C"      # Jazz Navy (official dark blue)
      secondary: "#F9A01B"    # Jazz Gold (official yellow/gold)
      accent: "#00471B"
    audience_name: "Utah Jazz Fans"
    comparison_population: "Local Gen Pop (Excl. Jazz)"
    category_mode: "standard"  # Back to standard mode for testing

  carolina_panthers:
    team_name: "Carolina Panthers"
    team_name_short: "Panthers"
    league: "NFL"
    view_prefix: "V_CAROLINA_PANTHERS_SIL"  # Following NFL pattern (no SIL)
    colors:
      primary: "#0085CA"      # Panthers Blue (official)
      secondary: "#101820"    # Black (official)
      accent: "#BFC0BF"       # Silver (official)
    audience_name: "Carolina Panthers Fans"
    comparison_population: "Local Gen Pop (Excl. Carolina Panthers Fans)"
    category_mode: "standard"  # Use existing 6+4 category system

  oakland_roots:
    team_name: "Oakland Roots"
    team_name_short: "Roots"
    league: "USL"
    view_prefix: "V_OAKLAND_ROOTS_SIL"
    colors:
      primary: "#00A651"      # Oakland Roots Green (official)
      secondary: "#000000"    # Black (official)
      accent: "#FFFFFF"       # White (accent)
    audience_name: "Oakland Soccer Fans"  # Key customization - broader segment
    comparison_population: "Local Gen Pop (Excl. Oakland Soccer Fans)"
    market_size: "small"      # Flag for potential threshold adjustments
    
    # Category customization
    category_mode: "custom"    # Toggle: "standard" or "custom"
    custom_categories:
      count: 6                 # How many categories they want
      selected_categories:
        - "Restaurants"            # More relevant than national chains
        - "Attractions"            # Oakland-specific attractions
        - "Entertainment & News"   # Local entertainment
        - "Health"                 # Community health
        - "Education Resources"    # Local education
        - "Sportstainment"         # Sports-related entertainment
      thresholds:
        min_audience_pct: 0.15     # Lower than major league 0.20
        min_merchant_audience_pct: 0.05  # Lower than major league 0.10

  miami_marlins:
    team_name: "Miami Marlins"
    team_name_short: "Marlins"
    league: "MLB"
    view_prefix: "V_MIAMI_MARLINS_SIL"
    colors:
      primary: "#00A3E0"      # Miami Blue (official)
      secondary: "#000000"    # Midnight Black (official)
      accent: "#EF3340"       # Caliente Red (official)
    audience_name: "Miami Marlins Fans"
    comparison_population: "Local Gen Pop (Excl. Miami Marlins Fans)"
    category_mode: "standard"

  detroit_tigers:
    team_name: "Detroit Tigers"
    team_name_short: "Tigers"
    league: "MLB"
    view_prefix: "V_DETROIT_TIGERS_SIL"
    colors:
      primary: "#0C2340"      # Tigers Navy (official)
      secondary: "#FA4616"    # Tigers Orange (official)
      accent: "#C4CED4"       # Tigers Gray (official)
    audience_name: "Detroit Tigers Fans"
    comparison_population: "Local Gen Pop (Excl. Detroit Tigers Fans)"
    category_mode: "standard"

  seattle_reign:
    team_name: "Seattle Reign"
    team_name_short: "Reign"
    league: "NWSL"
    view_prefix: "V_SEATTLE_REIGN_SIL"
    colors:
      primary: "#0053A0"      # Reign Blue (brand blue)
      secondary: "#000000"    # Black
      accent: "#FFFFFF"       # White
    audience_name: "Seattle Reign Fans"
    comparison_population: "Local Gen Pop (Excl. Seattle Reign Fans)"
    category_mode: "standard"

  serie_a:
    team_name: "Serie A"
    team_name_short: "Serie A"
    league: "International Soccer"
    view_prefix: "V_INTERNATIONAL_SOCCER_GS"
    colors:
      primary: "#000000"
      secondary: "#FFFFFF"
      accent: "#BFC0BF"
    audience_name: "International Soccer Fans"
    comparison_population: "General Population"
    demographics_communities:
      - "International Soccer Fans"
      - "General Population"
      - "General Sports Fans"
    category_mode: "standard"
    indexing_period: "SNAPSHOT"  # Use last-12-months snapshot views
    # Lower threshold so more communities qualify for Serie A schema
    min_behavior_audience_pct: 0.10

  south_carolina_tourism:
    team_name: "South Carolina Tourism"
    team_name_short: "SC Tourism"
    league: "Tourism"
    view_prefix: "SOUTH_CAROLINA_TOURISM"
    colors:
      primary: "#003366"      # South Carolina Blue
      secondary: "#CE1126"    # South Carolina Red
      accent: "#FFD700"       # Gold
    audience_name: "Genius_SCT_Family_Travelers"
    comparison_population: "Genius_SCT_Golfing_Travelers"
    demographics_communities:
      - "Genius_SCT_Family_Travelers"
      - "Genius_SCT_Golfing_Travelers"
      - "Genius_SCT_Outdoor_Enthusiasts_Travlers"
    category_mode: "standard"

  icahn_stadium_visitors:
    team_name: "Icahn Stadium Visitors"
    team_name_short: "Icahn Stadium"
    league: "Park Alliance"
    view_prefix: "SIL"  # All RIPA data uses SIL_ prefix
    snowflake_schema: "RIPA_GS"
    view_patterns:
      community_all_time: "{prefix}_COMMUNITY_INDEXING_ALL"
      community_last_full_year: "{prefix}_COMMUNITY_INDEXING_SNAPSHOT"
      category_all_time: "{prefix}_CATEGORY_INDEXING_ALL"
      category_last_full_year: "{prefix}_CATEGORY_INDEXING_SNAPSHOT"
      subcategory_all_time: "{prefix}_SUBCATEGORY_INDEXING_ALL"
      subcategory_last_full_year: "{prefix}_SUBCATEGORY_INDEXING_SNAPSHOT"
      merchant_all_time: "{prefix}_MERCHANT_INDEXING_ALL"
      merchant_last_full_year: "{prefix}_MERCHANT_INDEXING_ALL"
      community_merchant_all_time: "{prefix}_COMMUNITY_MERCHANT_INDEXING_ALL"
      community_merchant_last_full_year: "{prefix}_COMMUNITY_MERCHANT_INDEXING_SNAPSHOT"
      demographics: "GS_DEMOGRAPHICS_DIST"  # RIPA uses fixed table name
    colors:
      primary: "#2B6E41"      # Park Green
      secondary: "#1A4A2A"    # Dark Green
      accent: "#4A9E65"       # Light Green
    audience_name: "Icahn Stadium Visitors"
